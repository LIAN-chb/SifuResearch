<script>
const DATA=__DATA__;
const pageSwitch=document.getElementById('page-switch');for(const p of DATA.pages){const option=document.createElement('option');option.value=p.file;option.textContent=p.label;option.selected=p.page===DATA.page;pageSwitch.append(option);}pageSwitch.onchange=()=>location.assign(new URL(pageSwitch.value,location.href).href);if(DATA.page==='focus'){document.title='徒手专注';document.querySelector('h1').textContent='徒手专注';const note=document.createElement('p');note.className='focus-intro';note.textContent='在专注模式选择招式；点击查看消耗和覆盖命中配置。普通连段后续尚未接通，暂不绘制推测连线。';document.getElementById('stage').append(note);}
const G=DATA.graph,byId=new Map(G.nodes.map(n=>[n.id,n])),svg=document.getElementById('map'),camera=document.getElementById('camera'),drawer=document.getElementById('drawer'),body=document.getElementById('drawer-body');
svg.setAttribute('role','group');
const NS='http://www.w3.org/2000/svg',esc=s=>String(s??'未保存').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>typeof v==='number'?String(Number(v.toPrecision(6))):String(v??'未保存'),met=m=>m?.enabled===true?num(m.value):m?.enabled===false?'未启用':'未保存';
const label=k=>DATA.labels[k.replace(/\[\d+\]$/,'')]?.label||k;
const table=(h,rs)=>'<table><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+rs.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table>';
const raw=obj=>table(['字段','保存内容'],Object.entries(obj||{}).map(([k,v])=>[esc(label(k)),esc(typeof v==='object'?JSON.stringify(v):v)]));
const lvl=w=>{const p=w.raw['m_AttackPropertyLevel[0]']||{};return ['倒地','推退','眩晕'].map((t,i)=>t+num(p['m_Level['+i+']'])).join('／');};
const bool=v=>v===true?'是':v===false?'否':'未保存',power=v=>({'EAttackPowers::Light':'轻','EAttackPowers::Medium':'中','EAttackPowers::Strong':'强'}[v]||'未核');
function el(tag,attrs={},text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n;}
const regions=document.getElementById('regions'),common=document.getElementById('common-layer');
// Orthogonal paths avoid node rectangles. Individual source edges remain in DATA.
const step=20,W=Math.ceil(G.width/step),H=Math.ceil(G.height/step),blocked=new Set();
for(let x=0;x<=W;x++)for(let y=0;y<=H;y++)if(G.nodes.some(n=>Math.abs(x*step-n.x)<104&&Math.abs(y*step-n.y)<40))blocked.add(x+','+y);
class Heap{constructor(){this.a=[];}push(v){const a=this.a;a.push(v);let i=a.length-1;while(i){const p=(i-1)>>1;if(a[p][0]<=v[0])break;a[i]=a[p];i=p;}a[i]=v;}pop(){const a=this.a,out=a[0],last=a.pop();if(a.length){let i=0;while(true){let c=i*2+1;if(c>=a.length)break;if(c+1<a.length&&a[c+1][0]<a[c][0])c++;if(a[c][0]>=last[0])break;a[i]=a[c];i=c;}a[i]=last;}return out;}get size(){return this.a.length;}}
function search(start,end){const key=p=>p.join(','),sk=key(start),ek=key(end),heap=new Heap(),dist=new Map([[sk,0]]),prev=new Map();heap.push([0,...start]);while(heap.size){const [,x,y]=heap.pop(),k=x+','+y;if(k===ek){const path=[[x,y]];let at=k;while(prev.has(at)){const p=prev.get(at);path.push(p);at=key(p);}return path.reverse().map(p=>p.map(v=>v*step));}const cost=dist.get(k);for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){const nx=x+dx,ny=y+dy,nk=nx+','+ny;if(nx<0||ny<0||nx>W||ny>H||blocked.has(nk))continue;const nc=cost+1;if(nc<(dist.get(nk)??Infinity)){dist.set(nk,nc);prev.set(nk,[x,y]);heap.push([nc+Math.abs(end[0]-nx)+Math.abs(end[1]-ny),nx,ny]);}}}return null;}
function ports(n){return [{a:[n.x+94,n.y],p:[n.x+120,n.y],d:'r'},{a:[n.x-94,n.y],p:[n.x-120,n.y],d:'l'},{a:[n.x,n.y+29],p:[n.x,n.y+64],d:'b'},{a:[n.x,n.y-29],p:[n.x,n.y-64],d:'t'}];}
function route(a,b){if(a.y===b.y&&Math.abs(a.x-b.x)<=245){const sign=Math.sign(b.x-a.x);return [[a.x+sign*94,a.y],[b.x-sign*94,b.y]];}const pairs=[];for(const s of ports(a))for(const t of ports(b))pairs.push({s,t,c:Math.abs(s.p[0]-t.p[0])+Math.abs(s.p[1]-t.p[1])});pairs.sort((a,b)=>a.c-b.c);for(const {s,t} of pairs.slice(0,8)){const p=search(s.p.map(v=>Math.round(v/step)),t.p.map(v=>Math.round(v/step)));if(p)return [s.a,...p,t.a];}return [[a.x,a.y],[b.x,b.y]];}
const paths=new Map(),edgeLayer=document.getElementById('edges');
const basePairs=new Set(['44-45','45-14','14-7','7-8','48-4','4-5','5-10']);
for(const e of G.edges){if(e.target===null)continue;const points=route(byId.get(e.source),byId.get(e.target));const path=el('path',{d:points.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '),class:'edge'+(basePairs.has(e.id)?' base':''),'marker-end':'url(#arrow)','data-edge':e.id});edgeLayer.append(path);paths.set(e.id,{path,points,e});}
const nodeEls=new Map(),tooltip=document.getElementById('node-tooltip');
function officialHtml(items){return items?.length?'<div class="official-names">'+items.map(o=>'<p><strong>'+esc(o.name)+'</strong> <span class="muted">'+esc(o.scope)+'</span></p>').join('')+'</div>':'<p class="muted">未见与此动作独立对应的官方菜单名称，保留操作称呼。</p>';}
function hideTooltip(){tooltip.hidden=true;}
function showTooltip(n,event){if(document.body.classList.contains('editing'))return;tooltip.innerHTML=(n.official?.length?n.official.map(o=>'<strong>'+esc(o.name)+'</strong><small>'+esc(o.scope)+'</small>').join(''):'<strong>'+esc(n.label)+'</strong><small>操作称呼 · 未见独立官方名称</small>');tooltip.hidden=false;const box=nodeEls.get(n.id).getBoundingClientRect(),x=event?.clientX??box.right,y=event?.clientY??box.top;const size=tooltip.getBoundingClientRect();tooltip.style.left=Math.max(8,Math.min(innerWidth-size.width-8,x+14))+'px';tooltip.style.top=Math.max(8,Math.min(innerHeight-size.height-8,y+14))+'px';}

for(const n of G.nodes){const group=el('g',{class:'node',role:'button',tabindex:0,'aria-label':n.label,'aria-pressed':'false','data-node':n.id,'data-kind':n.action?.kind||'combo',transform:'translate('+n.x+','+n.y+')'});group.append(el('rect',{x:-94,y:-29,width:188,height:58,rx:10}));const lines=n.label.length>10&&n.label.includes('·')?n.label.split('·'):[n.label];const text=el('text',{y:lines.length===1?6:-5});lines.forEach((line,i)=>text.append(el('tspan',{x:0,dy:i?23:0},line)));group.append(text);group.setAttribute('aria-label',n.label+'；'+(n.official?.map(o=>o.name).join('、')||'未见独立官方名称'));group.setAttribute('aria-describedby','node-tooltip');group.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')showTooltip(n,e);});group.addEventListener('pointermove',e=>{if(!tooltip.hidden)showTooltip(n,e);});group.addEventListener('pointerleave',hideTooltip);group.addEventListener('focus',()=>showTooltip(n));group.addEventListener('blur',hideTooltip);group.addEventListener('click',()=>select(n.id));group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id);}});document.getElementById('nodes').append(group);nodeEls.set(n.id,group);}
let selected=null,lastFocus=null,hovered=null;
function readHighlightId(){return drawer.classList.contains('open')?selected:hovered;}
function highlight(id){const incoming=new Set(G.edges.filter(e=>e.target===id).map(e=>e.source)),outgoing=new Set(G.edges.filter(e=>e.source===id&&e.target!==null).map(e=>e.target));for(const [key,g] of nodeEls){const pre=incoming.has(key),post=outgoing.has(key);g.setAttribute('class','node'+(key===id?' is-selected':pre&&post?' is-both':pre?' is-in':post?' is-out':id!==null?' dim':''));g.setAttribute('aria-pressed',String(key===id));}document.getElementById('edge-labels').replaceChildren();for(const {path,e,points} of paths.values()){const pre=e.target===id,post=e.source===id;path.setAttribute('class','edge'+(basePairs.has(e.id)?' base':'')+(pre&&post?' both':pre?' incoming':post?' outgoing':id!==null?' quiet':''));if(!document.getElementById('all-lines').checked&&!pre&&!post&&!basePairs.has(e.id))path.classList.add('hidden');path.setAttribute('marker-end',pre?'url(#arrow-in)':post?'url(#arrow-out)':'url(#arrow)');if(pre||post){edgeLayer.append(path);const middle=points[Math.floor(points.length/2)],inputs=[...new Set(e.variants.map(v=>v.input))].map(s=>s.replace('（手势待核）',''));if(inputs.join('／').length<=16)document.getElementById('edge-labels').append(el('text',{x:middle[0]+5,y:middle[1]-7,class:'edge-label'},inputs.join('／')));}}for(const p of common.querySelectorAll('path'))p.classList.toggle('active',id!==null);return {incoming:[...incoming],outgoing:[...outgoing]};}
const quadrantNames={FrontLeft:'前左',FrontRight:'前右',BackRight:'后右',BackLeft:'后左'};
function orientation(slots){const names=(slots||[]).map(i=>DATA.research.quadrants[i]);return names.length===4?'正背通用':names.length&&names.every(n=>n?.startsWith('Front'))?'正面':names.length&&names.every(n=>n?.startsWith('Back'))?'背面':'朝向未接通';}
function avoidDirections(w){const mask=w.raw['m_iAvoidableDefenseMatrix[0]'];if(!Number.isInteger(mask))return '未保存';const labels={Jump:'跳避',Duck:'下潜',SideLeft:'左侧闪',SideRight:'右侧闪'},known=Object.entries(DATA.research.avoidBits).filter(([v])=>Number(v)>0),parts=known.filter(([v])=>mask&Number(v)).map(([,n])=>labels[n]||n),bits=known.reduce((a,[v])=>a|Number(v),0);if(mask&~bits)parts.push('未知位 '+(mask&~bits));return parts.join('／')||'无这些方向';}
function avoidSummary(ws){const dirs=[...new Set(ws.map(avoidDirections))];return dirs.length===1?'可避配置：'+dirs[0]:dirs.length?'各段可避方向不同':'无命中段';}

function relation(e,dir){const other=dir==='prev'?e.source:e.target,n=byId.get(other);return '<button class="relation '+dir+'" data-jump="'+other+'">'+esc(n?.label||'无保存目标')+e.variants.map(v=>'<small>'+esc(v.input)+(v.conditional?' · 有条件，分支 '+esc(v.key):'')+(v.probability!==100?' · 选择权重 '+num(v.probability):'')+'<br>原配置：'+esc(DATA.nodes[v.sourceConfig].name)+' → '+esc(DATA.nodes[v.rawTarget]?.name||'无目标')+'</small>').join('')+'</button>';}
function openDrawer(title,subtitle,content){setHelp(false);document.getElementById('drawer-title').textContent=title+(selected!==null&&title===byId.get(selected)?.label?'（'+nodeOrientation(byId.get(selected))+'）':'');document.getElementById('drawer-subtitle').textContent=subtitle;if(selected!==null&&title===byId.get(selected)?.label){const rows=G.starts.filter(e=>e.displayTarget===selected).map(e=>[esc(e.input),esc(DATA.nodes[e.target]?.name),e.condition?.reference?'有条件，分支键 '+esc(e.key):'无额外保存条件']);for(const e of G.internalEdges.filter(e=>e.display===selected))rows.push([esc(e.input),esc(DATA.nodes[e.rawTarget]?.name),'入口选择权重字段 '+num(e.probability)]);if(rows.length)content+='<h3>输入／入口选择与原配置对应</h3>'+table(['输入','对应配置','条件／权重'],rows);}body.innerHTML=content;body.scrollTop=0;drawer.classList.add('open');drawer.removeAttribute('inert');drawer.setAttribute('aria-hidden','false');body.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>select(Number(b.dataset.jump)));}

else{content+='<h3>操作入口</h3><p>'+esc(({'directional-throw':'抓住可投掷的对手后，使用推掷输入。','downed-target-attack':'对手倒地时，使用倒地攻击输入（短按或长按）。','ground-parry-counter':'玩家倒地时使用格挡反击，需要解锁「扭转乾坤」。'})[a.key]||a.entry)+'</p><p class="muted">此动作由独立能力输入进入，补充在同一画布中。尚未核到它与普通节点之间的具体衔接边。</p><p class="muted">未接通独立命中表，生命、架势与帧数暂不套用其他招式数值。</p>';}

function select(id){selected=id;lastFocus=nodeEls.get(id);const n=byId.get(id);hideTooltip();highlight(id);if(n.action){openAction(n);return;}const pre=G.edges.filter(e=>e.target===id),post=G.edges.filter(e=>e.source===id),starts=G.starts.filter(e=>e.displayTarget===id);const relations='<h3>能接到这里</h3>'+pre.map(e=>relation(e,'prev')).join('')+(starts.length?'<p class="muted">另有情境起手：'+[...new Set(starts.map(e=>({KnockedDown:'起身',Rush:'奔跑',Default:'常规／招架条件',PushInstigator:'推击后',Idle:'空闲',Dodge:'闪避',Grab:'抓取'}[e.rawState]||'情境')+' · '+e.input))].map(esc).join('；')+'。</p>':'')+(!pre.length&&!starts.length?'<p class="muted">没有已保存的前驱边；可能从默认输入起手。</p>':'')+'<h3>这里能接到</h3>'+post.map(e=>relation(e,'next')).join('')+(!post.length?'<p class="muted">没有保存的后续边，不代表不能接搓招、取消或其他系统动作。</p>':'')+'<details><summary>起手输入与合并方式</summary><p class="muted">按相同前驱／后继收纳配置；输入、技能、条件与伤害仍各自保留。未知关系的孤立节点没有强行归并。</p>'+table(['输入','对应配置','限制'],DATA.defaults.filter(e=>e.target!==null&&G.canonicalToDisplay[e.target]===id).map(e=>[esc(e.input),esc(DATA.nodes[e.target].name),e.fallback?'默认回退':'默认入口，受当前状态限制']))+starts.map(e=>'<p class="muted">'+esc(e.input)+' · '+(e.condition?.reference?'有条件，分支键 '+esc(e.key):'未保存额外条件')+'</p>').join('')+'</details>';let content='<h3>招式属性</h3>'+officialHtml(n.official)+'<p class="muted">正背相对身体／骨盆与目标。可避方向是配置许可，还需闪避匹配；目前不把它硬归为唯一上／中／下段。</p>';
 for(const config of n.configs){const c=DATA.nodes[config];if(!c.variants.length)continue;content+='<details class="configuration" open><summary>'+esc(c.name)+' · '+c.variants.length+'个姿态／蓄力配置</summary>'+officialHtml(c.official)+'<p class="muted">技能：'+esc(c.tags.length?c.tags.map(t=>DATA.skillNames[t.split('.').at(-1).toLowerCase()]||t).join('、'):'本节点未保存技能标签')+'</p>'+c.variants.map((v,i)=>variant(v,i,c.name)).join('')+(c.charge.length?'<p class="muted">蓄力过程：'+c.charge.map((x,i)=>'阶段'+(i+1)+'保存充能 '+num(x['m_fDurationOfCharging[0]'])+'秒，额外保持 '+num(x['m_fExtraHoldingTimeAfterChargeIscomplete[0]'])+'秒').join('；')+'。尚未换算最终放键时刻。</p>':'')+'</details>';}

 content+='<details open><summary>输入手势已核查</summary><p class="muted">轻击／重击的普通输入与变体输入均为短按后在0.2秒内松开，两者互列为同键输入栈兄弟，选择受输入栈和当前动作许可影响。Alt并非额外独立搓招，不能据此当成轻重同时按。长按配置为同键按住达到0.2秒。</p></details>';

let view={x:0,y:0,w:G.width,h:G.height};function renderView(){svg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '));document.getElementById('zoom-status').textContent=Math.round(G.width/view.w*100)+'%';}function fit(){view={x:0,y:0,w:G.width,h:G.height};renderView();}function zoom(f,cx=view.x+view.w/2,cy=view.y+view.h/2){const w=Math.max(430,Math.min(G.width*1.5,view.w*f)),ratio=w/view.w;view={x:cx-(cx-view.x)*ratio,y:cy-(cy-view.y)*ratio,w,h:view.h*ratio};renderView();}document.getElementById('fit').onclick=fit;document.getElementById('zoom-in').onclick=()=>zoom(.8);document.getElementById('zoom-out').onclick=()=>zoom(1.25);function point(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return p;}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY>0?1.12:.89,p.x,p.y);},{passive:false});let drag=null,moved=false;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,view:{...view},matrix:svg.getScreenCTM().inverse()};moved=false;svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)*drag.matrix.a,dy=(e.clientY-drag.y)*drag.matrix.d;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;view={...drag.view,x:drag.view.x-dx,y:drag.view.y-dy};renderView();});svg.addEventListener('pointerup',()=>{if(drag&&!moved)closeDrawer();drag=null;});svg.addEventListener('pointercancel',()=>{drag=null;});
